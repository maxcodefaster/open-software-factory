name: Factory Verification

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  verify:
    runs-on: factory-verification
    steps:
      - name: Confirm the assigned commit
        run: |
          test "$(cat /workspace/project/.git/HEAD)" = "${{ forgejo.event.pull_request.head.sha }}"
      - name: Run project checks
        run: |
          node --check /workspace/project/src/server.mjs
          node --check /workspace/project/src/worker.mjs
          test -s /workspace/project/src/version.txt
