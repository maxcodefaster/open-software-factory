<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Factory monitoring proof</title>
    <style>
      body { margin: 0; padding: 24px; background: var(--color-paper-cool); font-family: var(--font-interface); color: var(--color-ink); }
      .learning-fixture { max-width: 1000px; padding: 32px; margin: auto; background: var(--material-document); border-radius: var(--radius-window); }
      .learning-fixture > header { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
      .learning-fixture > header h1 { font-size:24px; font-weight:500; margin:0; }
      .learning-fixture > header span { font-size:12px; color:var(--color-ink-muted); }
      .learning-fixture > output { display:block; margin-top:24px; font-size:14px; }
      @media(max-width:760px) { body { padding:0; } .learning-fixture { padding:20px 16px; border-radius:0; } }
    </style>
  </head>

    <div id="root"></div>
