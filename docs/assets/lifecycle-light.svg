<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d">
<title id="t">The Factory cycle</title>
<desc id="d">Idea, Interview, Requirements, Design, Build, Review, Deliver and Learn form a loop. People approve requirements and delivery.</desc>
<rect width="960" height="720" rx="28" fill="#f6f7f9"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2c5a7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M530.7 120.1 A255 255 0 0 1 620.9 157.5" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M692.5 229.1 A255 255 0 0 1 729.9 319.3" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M729.9 420.7 A255 255 0 0 1 692.5 510.9" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M620.9 582.5 A255 255 0 0 1 530.7 619.9" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M429.3 619.9 A255 255 0 0 1 339.1 582.5" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M267.5 510.9 A255 255 0 0 1 230.1 420.7" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M230.1 319.3 A255 255 0 0 1 267.5 229.1" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<path d="M339.1 157.5 A255 255 0 0 1 429.3 120.1" fill="none" stroke="#2c5a7a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#a)" opacity="0.9"/>
<g transform="translate(361.0 84.0)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">1. Idea</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">A person writes it down</text>
</g>
<g transform="translate(541.3 158.7)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">2. Interview</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">AI asks what is missing</text>
</g>
<g transform="translate(616.0 339.0)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#2c5a7a" stroke-width="2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">3. Requirements</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">People approve the spec</text>
</g>
<g transform="translate(541.3 519.3)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">4. Design</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">Technical plan from the source</text>
</g>
<g transform="translate(361.0 594.0)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">5. Build</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">An agent works in a Sandbox</text>
</g>
<g transform="translate(180.7 519.3)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">6. Review</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">Independent review of the exact commit</text>
</g>
<g transform="translate(106.0 339.0)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#2c5a7a" stroke-width="2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">7. Deliver</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">People approve the verified commit</text>
</g>
<g transform="translate(180.7 158.7)">
<rect width="238" height="62" rx="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
<text x="16" y="25" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#14202b">8. Learn</text>
<text x="16" y="46" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#556677">Evidence becomes shared skills</text>
</g>
<text x="480.0" y="356.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#14202b">People decide.</text>
<text x="480.0" y="390.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#2c5a7a">Agents do the work.</text>
<text x="480.0" y="422.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#556677">Outlined steps wait for a human decision.</text>
</svg>
