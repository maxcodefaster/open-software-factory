# The operator prepares explicitly owned native fixtures on an amd64 runner.
# Missing Substrate fixture/configuration is a failure, never a skipped proof.
# This manual lane does not qualify the complete installed-image product journey.
name: Native Substrate lane
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-substrate
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, linux, x64, substrate]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: mise exec -- bun install --frozen-lockfile
      - name: Run the native Factory lane
        run: mise exec -- bun run test:native
