# Native Factorybox lane. It needs a self-hosted runner with the `sysbox` label: a Linux host that
# an operator has admitted for the pinned Factorybox worker (Sysbox, CRIU, Docker, Kubernetes
# access and the Factory test environment described in the README). It never runs for pull
# requests or release publication; start it on a schedule or with "Run workflow".
name: Native Factorybox lane
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-factorybox
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, sysbox]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: mise exec -- bun install --frozen-lockfile
      - name: Run the native Factory lane
        run: mise exec -- bun run test:native
      - name: Run runtime conformance against the admitted worker
        run: mise exec -- bun run runtime:conformance
