name: Publish distribution images
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: distribution-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate release tag and consolidated source
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  roles:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build native runtime roles
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$IMAGE_ROOT/factory:$RELEASE" > /dev/null 2>&1; then
            echo 'This distribution version is already published. Choose a new version.'
            exit 1
          fi
          docker buildx create --use
          for role in runtime-host build-runtime-host verification-runtime-host developer-ide browser-tools workspace-files; do
            image="$IMAGE_ROOT/$role:$RELEASE-$ARCH"
            if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "Architecture image already exists: $image"
              exit 1
            fi
            dockerfile=deploy/runtime-host/Dockerfile
            target=(--target "$role")
            if [[ "$role" == browser-tools || "$role" == workspace-files ]]; then
              dockerfile="deploy/$role/Dockerfile"
              target=()
            fi
            docker buildx build --platform "linux/$ARCH" --provenance=false --push \
              --file "$dockerfile" "${target[@]}" --tag "$image" .
          done
  manifests:
    needs: [release, roles]
    runs-on: ubuntu-24.04
    outputs:
      artifacts: ${{ steps.publish.outputs.artifacts }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - name: Publish multi-architecture role manifests
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          artifacts='{}'
          for role in runtime-host build-runtime-host verification-runtime-host developer-ide browser-tools workspace-files; do
            image="$IMAGE_ROOT/$role:$RELEASE"
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            artifacts="$(jq -c --arg role "$role" --arg ref "$IMAGE_ROOT/$role@$digest" '. + {($role): $ref}' <<< "$artifacts")"
          done
          printf 'artifacts=%s\n' "$artifacts" >> "$GITHUB_OUTPUT"
  factory:
    needs: [release, manifests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build native Factory with exact runtime references
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_RUNTIME_ARTIFACTS: ${{ needs.manifests.outputs.artifacts }}
        run: |
          set -euo pipefail
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          if docker buildx imagetools inspect "$IMAGE_ROOT/factory:$RELEASE-$ARCH" > /dev/null 2>&1; then
            echo 'Factory architecture image already exists. Choose a new release version.'
            exit 1
          fi
          docker buildx build --platform "linux/$ARCH" --provenance=false --push \
            --file deploy/factory/Dockerfile --build-arg FACTORY_RUNTIME_ARTIFACTS \
            --tag "$IMAGE_ROOT/factory:$RELEASE-$ARCH" .
  distribution:
    needs: [release, factory]
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - name: Publish multi-architecture Factory manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE_ROOT/factory:$RELEASE" \
            "$IMAGE_ROOT/factory:$RELEASE-amd64" "$IMAGE_ROOT/factory:$RELEASE-arm64"
