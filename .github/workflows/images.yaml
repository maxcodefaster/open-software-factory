name: Publish distribution images
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or resume
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
env:
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - name: Validate release tag and consolidated source
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yaml
    with:
      source_ref: ${{ github.event.release.tag_name || inputs.release_tag }}
  roles:
    needs: [release, verify]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Read native proof tool pins
        id: proof-tools
        run: |
          node -e 'const fs=require("fs"),u=JSON.parse(fs.readFileSync("upstream.json","utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`go=${u.go.version}\nnode=${u.nodeDevelopment.image}\n`);'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ steps.proof-tools.outputs.go }}
          cache-dependency-path: services/runtime-connector/go.sum
      - name: Build native runtime roles
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PROOF_IMAGE: ${{ steps.proof-tools.outputs.node }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          source scripts/factory/release-lib.sh
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          REVISION="$(git rev-parse HEAD)"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if release_exists "$IMAGE_ROOT/factory:$RELEASE"; then
            echo 'This distribution version is already published. Choose a new version.'
            exit 1
          fi
          docker buildx create --use --driver-opt "image=$BUILDKIT_IMAGE"
          for role in runtime-host developer-ide browser-tools workspace-files; do
            image="$IMAGE_ROOT/$role:$RELEASE-$ARCH"
            if release_exists "$image"; then
              release_require_revision "$image" "$REVISION"
              echo "Reusing the architecture image from an earlier attempt: $image"
            else
              dockerfile=deploy/runtime-host/Dockerfile
              target=(--target "$role")
              if [[ "$role" == browser-tools || "$role" == workspace-files ]]; then
                dockerfile="deploy/$role/Dockerfile"
                target=()
              fi
              build=(docker buildx build --platform "linux/$ARCH"
                --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                --label "org.opencontainers.image.revision=$REVISION"
                --label "org.opencontainers.image.version=$RELEASE"
                --file "$dockerfile" "${target[@]}" --tag "$image")
              attest=(--provenance=mode=max "--sbom=generator=$SBOM_GENERATOR")
              if [[ "$role" == runtime-host ]]; then
                "${build[@]}" --provenance=false --sbom=false --load \
                  --metadata-file "$RUNNER_TEMP/runtime-host-proven.json" .
                image_id="$(docker image inspect --format '{{.Id}}' "$image")"
                proven_config="$(jq -er '."containerimage.config.digest"' "$RUNNER_TEMP/runtime-host-proven.json")"
                [[ "$proven_config" =~ ^sha256:[a-f0-9]{64}$ ]]
                bash scripts/runtime/compose-inputs-proof.sh "$image_id"
                registry_proof_image="$(sed -n 's/^[[:space:]]*image: \(docker.io\/library\/registry:[^[:space:]]*\).*/\1/p' deploy/runtime-smoke/registry.yaml)"
                bash scripts/runtime/project-compose-prebuild-proof.sh "$image_id" "$NODE_PROOF_IMAGE" "$registry_proof_image"
                test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image_id"
                # The proven layers come from the build cache. Publish them with attestations
                # and refuse any result whose image configuration is not the proven one.
                "${build[@]}" "${attest[@]}" --push --metadata-file "$RUNNER_TEMP/runtime-host.json" .
                test "$(jq -r '."containerimage.config.digest"' "$RUNNER_TEMP/runtime-host.json")" = "$proven_config"
              else
                "${build[@]}" "${attest[@]}" --push .
              fi
            fi
            digest="$(release_digest "$image")"
            release_sign "$IMAGE_ROOT/$role@$digest"
          done
  manifests:
    needs: [release, roles]
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    outputs:
      artifacts: ${{ steps.publish.outputs.artifacts }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Publish multi-architecture role manifests
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/factory/release-lib.sh
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          artifacts='{}'
          for role in runtime-host developer-ide browser-tools workspace-files; do
            image="$IMAGE_ROOT/$role:$RELEASE"
            digest="$(release_combine "$image" "$image-arm64" "$image-amd64")"
            release_sign "$IMAGE_ROOT/$role@$digest"
            artifacts="$(jq -c --arg role "$role" --arg ref "$IMAGE_ROOT/$role@$digest" '. + {($role): $ref}' <<< "$artifacts")"
          done
          printf 'artifacts=%s\n' "$artifacts" >> "$GITHUB_OUTPUT"
  factory:
    needs: [release, manifests]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build native Factory with exact runtime references
        id: build
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_RUNTIME_ARTIFACTS: ${{ needs.manifests.outputs.artifacts }}
        run: |
          set -euo pipefail
          source scripts/factory/release-lib.sh
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          REVISION="$(git rev-parse HEAD)"
          image="$IMAGE_ROOT/factory:$RELEASE-$ARCH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if release_exists "$IMAGE_ROOT/factory:$RELEASE"; then
            echo 'This distribution version is already published. Choose a new release version.'
            exit 1
          fi
          if release_exists "$image"; then
            release_require_revision "$image" "$REVISION"
            echo "Reusing the Factory architecture image from an earlier attempt: $image"
          else
            docker buildx create --use --driver-opt "image=$BUILDKIT_IMAGE"
            docker buildx build --platform "linux/$ARCH" \
              --provenance=mode=max "--sbom=generator=$SBOM_GENERATOR" --push \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.version=$RELEASE" \
              --file deploy/factory/Dockerfile --build-arg FACTORY_RUNTIME_ARTIFACTS \
              --tag "$image" .
          fi
          digest="$(release_digest "$image")"
          printf 'ref=%s@%s\n' "$IMAGE_ROOT/factory" "$digest" >> "$GITHUB_OUTPUT"
      - name: Start the pushed Factory image
        env:
          IMAGE_REF: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm --network=none --read-only --cap-drop=ALL --user 1000:1000 \
            --security-opt=no-new-privileges --tmpfs /tmp --workdir /opt/factory --entrypoint bun \
            --volume "$PWD/scripts/factory/image-smoke.ts:/smoke/image-smoke.ts:ro" \
            "$IMAGE_REF" /smoke/image-smoke.ts
      - name: Scan the Factory image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Sign the Factory architecture image
        env:
          IMAGE_REF: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          source scripts/factory/release-lib.sh
          release_sign "$IMAGE_REF"
  distribution:
    needs: [release, factory]
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    outputs:
      factory: ${{ steps.publish.outputs.factory }}
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      IMAGE_ROOT: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Publish the Factory manifest
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/factory/release-lib.sh
          IMAGE_ROOT="${IMAGE_ROOT,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="$IMAGE_ROOT/factory:$RELEASE"
          digest="$(release_combine "$image" "$image-arm64" "$image-amd64")"
          release_sign "$IMAGE_ROOT/factory@$digest"
          printf 'factory=%s@%s\n' "$IMAGE_ROOT/factory" "$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Factory $RELEASE"
            echo
            echo 'Pin this digest in the Helm chart `image` value:'
            echo
            echo '```'
            echo "$IMAGE_ROOT/factory@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  chart:
    needs: [release, distribution]
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      FACTORY_IMAGE: ${{ needs.distribution.outputs.factory }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Package the chart with the released images
        run: |
          set -euo pipefail
          mise exec -- bun install --frozen-lockfile
          mkdir dist
          mise exec -- bun scripts/release/package-chart.ts --version "$RELEASE" \
            --factory-image "$FACTORY_IMAGE" --output dist
          mise exec -- helm lint "dist/factory-$RELEASE.tgz" --set "factorybox.nodeName=lint-node" \
            --set publicURL=http://127.0.0.1:3000 --set forgejoPublicURL=http://127.0.0.1:3001 \
            --set development=true --set developmentZeroURL=http://127.0.0.1:3002
          mise exec -- helm lint "dist/factory-$RELEASE.tgz" --values "dist/factory-amd64-$RELEASE.yaml" \
            --set factorybox.nodeName=lint-node --set publicURL=http://127.0.0.1:3000 \
            --set forgejoPublicURL=http://127.0.0.1:3001 --set development=true \
            --set developmentZeroURL=http://127.0.0.1:3002
      - name: Publish and sign the chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GHCR_TOKEN" | mise exec -- helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          pushed="$(mise exec -- helm push "dist/factory-$RELEASE.tgz" "oci://ghcr.io/$owner/charts" 2>&1)"
          echo "$pushed"
          digest="$(sed -n 's/^Digest: //p' <<< "$pushed" | head -n1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "ghcr.io/$owner/charts/factory@$digest"
          gh release upload "$TAG" "dist/factory-$RELEASE.tgz" \
            "dist/factory-arm64-$RELEASE.yaml" "dist/factory-amd64-$RELEASE.yaml" \
            --clobber --repo "$GITHUB_REPOSITORY"
