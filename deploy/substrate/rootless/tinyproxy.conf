Port 8888
Listen 0.0.0.0
# Quiet MCP calls and registry work keep their own shorter execution deadlines.
# Do not close their verified TLS tunnel while they await a response.
Timeout 900
LogLevel Info
MaxClients 32
Allow 127.0.0.1
Allow 10.0.2.0/24
Allow 172.16.0.0/12
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
