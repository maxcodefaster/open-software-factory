apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
spec:
  template:
    spec:
      containers:
        - name: atelet
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
