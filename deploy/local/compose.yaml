services:
  postgres:
    image: docker.io/library/postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${FACTORY_LOCAL_DB_PASSWORD:-factory-local-only}
    ports:
      - "127.0.0.1:${FACTORY_LOCAL_POSTGRES_PORT:-57432}:5432"
    labels: &installation-labels
      factory.dev/installation: ${FACTORY_INSTALLATION_OWNER:-local-development}
      factory.dev/disposable: ${FACTORY_INSTALLATION_DISPOSABLE:-false}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - factory-postgres:/var/lib/postgresql/data
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.10-rootless@sha256:6ffebd9ab9ee9f6677e3523fa60debd9de630ff2a226fa681d6cc0c7ba541d77
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__oauth2_client__ACCOUNT_LINKING: "disabled"
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "false"
      FORGEJO__oauth2__DEFAULT_APPLICATIONS: "git-credential-oauth,git-credential-manager"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:${FACTORY_LOCAL_FORGEJO_PORT:-33030}/
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__webhook__ALLOWED_HOST_LIST: ${FACTORY_RUNTIME_HOST:-host.orb.internal},host.docker.internal
      FORGEJO__migrations__ALLOWED_DOMAINS: ${FACTORY_FORGEJO_IMPORT_DOMAINS:-github.com,gitlab.com,codeberg.org}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${FACTORY_LOCAL_FORGEJO_PORT:-33030}:3000"
    labels: *installation-labels
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
  zero-cache:
    image: docker.io/rocicorp/zero:1.10.0@sha256:745c80f13eb53f5b74e5423d9051269aaa26cd32333fc8da4229b03800d58437
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZERO_UPSTREAM_DB: postgresql://factory:${FACTORY_LOCAL_DB_PASSWORD:-factory-local-only}@postgres:5432/factory
      ZERO_CVR_DB: postgresql://factory:${FACTORY_LOCAL_DB_PASSWORD:-factory-local-only}@postgres:5432/factory
      ZERO_CHANGE_DB: postgresql://factory:${FACTORY_LOCAL_DB_PASSWORD:-factory-local-only}@postgres:5432/factory
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${FACTORY_LOCAL_ZERO_PASSWORD:-factory-local-zero-password}
      ZERO_QUERY_URL: http://host.docker.internal:${FACTORY_LOCAL_PORT:-3000}/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:${FACTORY_LOCAL_PORT:-3000}/api/zero/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_APP_PUBLICATIONS: factory_zero_publication
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS: "60"
      DO_NOT_TRACK: "1"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${FACTORY_LOCAL_ZERO_PORT:-4948}:4848"
    labels: *installation-labels
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4848/keepalive"]
      interval: 2s
      timeout: 2s
      retries: 150
      start_period: 30s
    stop_grace_period: 10m
    volumes:
      - zero-cache-data:/data
  # Select this service explicitly. Its shared launcher bootstraps the dependent
  # services with private generated credentials before starting Factory.
  factory:
    profiles: [factory]
    image: ${FACTORY_IMAGE:-open-software-factory:local}
    build:
      context: ../..
      dockerfile: deploy/factory/Dockerfile
    init: true
    restart: unless-stopped
    network_mode: host
    labels: *installation-labels
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-local}
      NODE_ENV: development
      FACTORY_INSTALLATION_OWNER: ${FACTORY_INSTALLATION_OWNER:-local-development}
      FACTORY_INSTALLATION_DISPOSABLE: ${FACTORY_INSTALLATION_DISPOSABLE:-false}
      FACTORY_STATE_DIRECTORY: ${FACTORY_STATE_DIRECTORY:-${PWD}/.factory/compose}
      FACTORY_RUNTIME_HOST: ${FACTORY_RUNTIME_HOST:-host.orb.internal}
      FACTORY_HOST: ${FACTORY_HOST:-0.0.0.0}
      FACTORY_KUBERNETES_CONTEXT: ${FACTORY_KUBERNETES_CONTEXT:-}
      KUBECONFIG: /run/factory/kubeconfig
      FACTORY_LOCAL_PORT: ${FACTORY_LOCAL_PORT:-3000}
      FACTORY_LOCAL_POSTGRES_PORT: ${FACTORY_LOCAL_POSTGRES_PORT:-57432}
      FACTORY_LOCAL_FORGEJO_PORT: ${FACTORY_LOCAL_FORGEJO_PORT:-33030}
      FACTORY_LOCAL_ZERO_PORT: ${FACTORY_LOCAL_ZERO_PORT:-4948}
      FACTORY_ADMIN_EMAIL: ${FACTORY_ADMIN_EMAIL:-admin@factory.local}
      FACTORY_ADMIN_PASSWORD: ${FACTORY_ADMIN_PASSWORD:-}
      FACTORY_EXECUTION_RESERVE_TARGET: ${FACTORY_EXECUTION_RESERVE_TARGET:-0}
      FACTORY_EXECUTION_MAX_SLOTS: ${FACTORY_EXECUTION_MAX_SLOTS:-16}
      FACTORY_EXECUTION_IDLE_MINUTES: ${FACTORY_EXECUTION_IDLE_MINUTES:-30}
      FACTORY_MODEL_ALLOWED_ORIGINS: ${FACTORY_MODEL_ALLOWED_ORIGINS:-}
      FACTORY_GIT_IMPORT_ORIGINS: ${FACTORY_GIT_IMPORT_ORIGINS-https://github.com,https://gitlab.com,https://codeberg.org}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FACTORY_KUBECONFIG:-${HOME}/.kube/config}:/run/factory/kubeconfig:ro
      - ${FACTORY_STATE_DIRECTORY:-${PWD}/.factory/compose}:${FACTORY_STATE_DIRECTORY:-${PWD}/.factory/compose}
    healthcheck:
      test: [CMD, bun, scripts/factory/healthcheck.ts]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
  openbao:
    profiles: [secrets]
    image: docker.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    container_name: ${FACTORY_OPENBAO_CONTAINER:-factory-openbao-unconfigured}
    user: "0:0"
    entrypoint: [/usr/bin/bao]
    command: [server, -config=/bao/config/config.json]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    memswap_limit: 512m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    labels:
      factory.openbao-owner: ${FACTORY_OPENBAO_OWNER:-unconfigured}
    ports:
      - "127.0.0.1:${FACTORY_OPENBAO_PORT:-58200}:8200"
    volumes:
      - ${FACTORY_OPENBAO_CONFIG:-${PWD}/.factory/openbao/config}:/bao/config:ro
      - openbao-data:/bao/data
volumes:
  openbao-data:
    external: true
    name: ${FACTORY_OPENBAO_VOLUME:-factory-openbao-unconfigured-data}
  factory-postgres:
    labels: *installation-labels
  forgejo-data:
    labels: *installation-labels
  forgejo-config:
    labels: *installation-labels
  zero-cache-data:
    labels: *installation-labels
networks:
  default:
    labels: *installation-labels
