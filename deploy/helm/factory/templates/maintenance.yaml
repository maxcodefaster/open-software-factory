apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "factory.name" . }}-maintenance
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: maintenance
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      restartPolicy: Never
      automountServiceAccountToken: false
      # The Job only talks to PostgreSQL and needs no state volume, so it can use the image's node user.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: maintenance
          image: {{ include "factory.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [bun, scripts/kubernetes/maintenance.ts]
          securityContext:
            runAsNonRoot: true
            {{- include "factory.containerSecurity" . | nindent 12 }}
          env:
            - name: FACTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "factory.credentialsSecret" . | quote }}, key: database-password}
            - name: DATABASE_URL
              value: "postgresql://factory:$(FACTORY_DATABASE_PASSWORD)@{{ include "factory.name" . }}-postgres.{{ .Release.Namespace }}.svc:5432/factory"
          resources:
            {{- toYaml .Values.maintenance.resources | nindent 12 }}
