{{- if include "factory.managedIngressTLS" . -}}
{{- $name := include "factory.name" . -}}
{{- $identity := include "factory.ingressIdentity" . | fromJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ingress-ca
  labels:
    {{- include "factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-tls
  annotations:
    helm.sh/resource-policy: keep
    factory.dev/tls-hosts: {{ include "factory.ingressHosts" . | quote }}
type: Opaque
immutable: true
data:
  ca.crt: {{ $identity.ca.crt | quote }}
  ca.key: {{ $identity.ca.key | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ingress-tls
  labels:
    {{- include "factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-tls
  annotations:
    helm.sh/resource-policy: keep
    factory.dev/tls-hosts: {{ include "factory.ingressHosts" . | quote }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $identity.ca.crt | quote }}
  tls.crt: {{ $identity.leaf.crt | quote }}
  tls.key: {{ $identity.leaf.key | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-ingress-tls
  labels:
    {{- include "factory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-ingress-tls
  labels:
    {{- include "factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-ingress-tls" $name | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-ingress-tls
  labels:
    {{- include "factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-ingress-tls
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-ingress-tls
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-ingress-tls
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  schedule: "43 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
            app.kubernetes.io/component: ingress-tls
        spec:
          nodeSelector: {kubernetes.io/os: linux}
          serviceAccountName: {{ $name }}-ingress-tls
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: renew
              image: {{ include "factory.image" . }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: [bun, scripts/kubernetes/ingress-tls.ts]
              securityContext:
                {{- include "factory.containerSecurity" . | nindent 16 }}
              env:
                - name: FACTORY_NAMESPACE
                  valueFrom:
                    fieldRef: {fieldPath: metadata.namespace}
                - {name: FACTORY_HELM_RELEASE, value: {{ .Release.Name | quote }}}
                - {name: FACTORY_INGRESS_TLS_SECRET, value: "{{ $name }}-ingress-tls"}
                - {name: FACTORY_INGRESS_TLS_HOSTS, value: {{ include "factory.ingressHosts" . | quote }}}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: "1", memory: 128Mi}
              volumeMounts:
                - {name: ca, mountPath: /run/factory/ingress-ca, readOnly: true}
                - {name: temporary, mountPath: /tmp}
          volumes:
            - name: ca
              secret:
                secretName: {{ $name }}-ingress-ca
                items: [{key: ca.crt, path: ca.crt}, {key: ca.key, path: ca.key}]
            - name: temporary
              emptyDir: {medium: Memory, sizeLimit: 16Mi}
{{- end }}
