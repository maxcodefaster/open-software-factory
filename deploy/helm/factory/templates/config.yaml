{{- if not (has .Values.factorybox.architecture (list "arm64" "amd64")) }}
{{- fail "factorybox.architecture must be arm64 or amd64" }}
{{- end }}
{{- $storeGiB := int .Values.factorybox.storeGiB }}
{{- $minimumStoreGiB := 8 }}
{{- if hasKey .Values.factorybox "minimumStoreGiB" }}
{{- $minimumStoreGiB = int .Values.factorybox.minimumStoreGiB }}
{{- if ne (toString .Values.factorybox.minimumStoreGiB) (printf "%d" $minimumStoreGiB) }}
{{- fail "factorybox.minimumStoreGiB must be a whole number between 8 and storeGiB" }}
{{- end }}
{{- end }}
{{- $claimGiB := int .Values.factorybox.claimGiB }}
{{- $cpuRequestMilli := int .Values.factorybox.cpuRequestMilli }}
{{- if or (ne (toString .Values.factorybox.cpuRequestMilli) (printf "%d" $cpuRequestMilli)) (lt $cpuRequestMilli 10) (gt $cpuRequestMilli 3000) }}
{{- fail "factorybox.cpuRequestMilli must be a whole number between 10 and 3000" }}
{{- end }}
{{- if or (lt $minimumStoreGiB 8) (gt $minimumStoreGiB $storeGiB) }}
{{- fail "factorybox.minimumStoreGiB must be a whole number between 8 and storeGiB" }}
{{- end }}
{{- if or (ne (toString .Values.factorybox.storeGiB) (printf "%d" $storeGiB)) (lt $storeGiB 8) (gt $storeGiB 32) }}
{{- fail "factorybox.storeGiB must be a whole number between 8 and 32" }}
{{- end }}
{{- if or (ne (toString .Values.factorybox.claimGiB) (printf "%d" $claimGiB)) (lt $claimGiB 32) (gt $claimGiB 1024) (lt $claimGiB (add $storeGiB 17)) }}
{{- fail "factorybox.claimGiB must be a whole number between 32 and 1024 and at least storeGiB + 17" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "factory.name" . }}-config
  labels:
    {{- include "factory.labels" . | nindent 4 }}
data:
  HOME: "/tmp/factory-home"
  KUBECONFIG: "/tmp/factory-kubernetes/config.json"
  FACTORY_KUBERNETES_CONTEXT: "factory"
  NODE_ENV: {{ ternary "development" "production" .Values.development | quote }}
  FACTORY_HOST: "0.0.0.0"
  FACTORY_PORT: "3000"
  FACTORY_BASE_URL: {{ include "factory.publicURL" . | quote }}
  FACTORY_AUTH_COOKIE_PREFIX: "factory-{{ printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 16 }}"
  FACTORY_FORGEJO_PUBLIC_URL: {{ include "factory.forgeURL" . | quote }}
  FACTORY_INTERNAL_URL: "http://{{ include "factory.name" . }}-internal.{{ .Release.Namespace }}.svc:3000"
  FACTORY_WIKI_WEBHOOK_URL: "http://{{ include "factory.name" . }}-internal.{{ .Release.Namespace }}.svc:3000"
  FACTORY_AUTH_BACKCHANNEL_URL: "http://{{ include "factory.name" . }}-internal.{{ .Release.Namespace }}.svc:3000"
  FACTORY_FORGE_DISCOVERY_URL: "http://{{ include "factory.name" . }}-internal.{{ .Release.Namespace }}.svc:3000/api/auth/.well-known/openid-configuration"
  FACTORY_FORGEJO_API_URL: "http://{{ include "factory.name" . }}-forgejo.{{ .Release.Namespace }}.svc:3000/api/v1/"
  FACTORY_GIT_IMPORT_ORIGINS: {{ join "," (uniq (concat (list "https://github.com" "https://gitlab.com" "https://codeberg.org") .Values.gitAllowedOrigins)) | quote }}
  FACTORY_ZERO_CACHE_URL: "http://{{ include "factory.name" . }}-zero.{{ .Release.Namespace }}.svc:4848"
  FACTORY_ZERO_CACHE_PUBLIC_URL: {{ include "factory.zeroBrowserURL" . | quote }}
  FACTORY_OPENBAO_URL: "https://{{ include "factory.name" . }}-openbao.{{ .Release.Namespace }}.svc:8200"
  FACTORY_OPENBAO_CA_FILE: "/run/factory/openbao/ca.crt"
  FACTORY_REGISTRY_CA_FILE: {{ ternary "/run/factory/registry/ca.crt" "/etc/ssl/certs/ca-certificates.crt" (not (empty .Values.registryCASecret)) | quote }}
  FACTORY_STATE_DIRECTORY: "/var/lib/factory"
  FACTORY_OBJECT_S3_ENDPOINT: "http://{{ include "factory.name" . }}-objects.{{ .Release.Namespace }}.svc:3900"
  FACTORY_OBJECT_S3_BUCKET: "factory"
  FACTORY_OBJECT_S3_REGION: "garage"
  FACTORY_ATTACHMENT_FILE_BYTES: {{ .Values.attachments.fileBytes | quote }}
  FACTORY_ATTACHMENT_MESSAGE_BYTES: {{ .Values.attachments.messageBytes | quote }}
  FACTORY_STORAGE_CLASS: {{ .Values.storageClass | quote }}
  FACTORY_ADMIN_EMAIL: {{ .Values.adminEmail | quote }}
  FACTORY_MODEL_ALLOWED_ORIGINS: {{ join "," .Values.modelAllowedOrigins | quote }}
  FACTORY_FORGEJO_OWNER: "factory-mutation"
  FACTORY_FORGEJO_POD: "{{ include "factory.name" . }}-forgejo-0"
  FACTORY_HELM_RELEASE: {{ .Release.Name | quote }}
  FACTORY_EXECUTION_RESERVE_TARGET: {{ .Values.executionReserveTarget | quote }}
  FACTORY_FACTORYBOX_WORKER_IMAGE: {{ required "factorybox.image requires an admitted private worker digest" .Values.factorybox.image | quote }}
  FACTORY_FACTORYBOX_EXECUTABLE_SHA256: {{ required "factorybox.executableSHA256 is required" .Values.factorybox.executableSHA256 | quote }}
  FACTORY_FACTORYBOX_CPU_REQUEST_MILLI: {{ $cpuRequestMilli | quote }}
  FACTORY_FACTORYBOX_ARCHITECTURE: {{ required "factorybox.architecture must be arm64 or amd64" .Values.factorybox.architecture | quote }}
  FACTORY_FACTORYBOX_NODE: {{ required "factorybox.nodeName is required" .Values.factorybox.nodeName | quote }}
  FACTORY_FACTORYBOX_KERNEL: {{ required "factorybox.kernel is required" .Values.factorybox.kernel | quote }}
  FACTORY_FACTORYBOX_BOUNDED_BYTES: {{ mul $storeGiB 1073741824 | quote }}
  FACTORY_FACTORYBOX_MINIMUM_BOUNDED_BYTES: {{ mul $minimumStoreGiB 1073741824 | quote }}
  FACTORY_FACTORYBOX_CLAIM_GIB: {{ $claimGiB | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "factory.name" . }}-openbao
  labels:
    {{- include "factory.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "storage": {"raft": {"path": "/bao/data", "node_id": "factory"}},
      "api_addr": "https://{{ include "factory.name" . }}-openbao.{{ .Release.Namespace }}.svc:8200",
      "cluster_addr": "https://127.0.0.1:8201",
      "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_cert_file": "/bao/tls/tls.crt", "tls_key_file": "/bao/tls/tls.key"}},
      "ui": false
    }
