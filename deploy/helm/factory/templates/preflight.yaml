{{- /*
`helm test RELEASE` reads the native profile, original WorkerPool, a Ready worker
and installation StorageClass. It creates no Actors, probe Pods or namespaces.
The separate ServiceAccount has read-only Kubernetes permissions and receives no
native provisioner credential. Actor assignment and full runtime qualification
are verified by the explicit live lane, not by this preflight. The identity and
read-only RBAC are normal release resources: Helm may complete and delete a
non-Job test hook before starting the Job that needs it.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "factory.name" . }}-preflight
  labels:
    {{- include "factory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}-preflight
  labels:
    {{- include "factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["ate.dev"]
    resources: [workerpools]
    verbs: [get, list]
  - apiGroups: ["ate.dev"]
    resources: [sandboxconfigs]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}-preflight
  labels:
    {{- include "factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "factory.name" . }}-preflight
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}-preflight
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "factory.name" . }}-preflight
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: preflight
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      restartPolicy: Never
      serviceAccountName: {{ include "factory.name" . }}-preflight
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: {{ include "factory.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [bun, scripts/kubernetes/preflight.ts, --service-account]
          securityContext:
            runAsNonRoot: true
            {{- include "factory.containerSecurity" . | nindent 12 }}
          envFrom:
            - configMapRef: {name: "{{ include "factory.name" . }}-config"}
          env:
            - name: HOME
              value: /tmp
            # The preflight writes its own private, temporary kubeconfig referencing
            # this Pod's rotating ServiceAccount token and CA, not kubectl's fallback.
            - {name: FACTORY_KUBERNETES_CONTEXT, value: ""}
            - {name: KUBECONFIG, value: ""}
            - name: FACTORY_SUBSTRATE_WORKSPACES_CONFIGURATION
              value: /run/factory/substrate-configuration/configuration.json
            - name: FACTORY_PREFLIGHT_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: substrate-configuration, mountPath: /run/factory/substrate-configuration, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: substrate-configuration
          {{- include "factory.substrateConfigurationVolume" . | nindent 10 }}
