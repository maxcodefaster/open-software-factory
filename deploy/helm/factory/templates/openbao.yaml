{{- $localStatus := "bao status -address=https://127.0.0.1:8200 -ca-cert=/bao/tls/ca.crt >/dev/null; result=$?; test \"$result\" -eq 0 -o \"$result\" -eq 2" -}}
{{- $openbaoImage := "docker.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "factory.name" . }}-openbao
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "factory.name" . }}-openbao
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: openbao
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- $existing := include "factory.existingSecretChecksum" (dict "root" . "names" (list .Values.existingSecrets.openbaoTLS)) }}
        {{- if $existing }}
        checksum/existing-secrets: {{ $existing }}
        {{- end }}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      # The image's openbao account is 100:1000. Its entrypoint is bypassed, so nothing
      # else chowns the retained raft volume; the first init container does.
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        {{- include "factory.ownVolume" (dict "image" $openbaoImage "path" "/bao/data" "uid" 100 "gid" 1000) | nindent 8 }}
      containers:
        - name: openbao
          image: {{ $openbaoImage }}
          command: [/usr/bin/bao, server, -config=/bao/config/config.json]
          securityContext:
            runAsNonRoot: true
            {{- include "factory.containerSecurity" . | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'bao status -address=https://{{ include "factory.name" . }}-openbao.{{ .Release.Namespace }}.svc:8200 -ca-cert=/bao/tls/ca.crt >/dev/null; result=$?; test "$result" -eq 0 -o "$result" -eq 2'
            periodSeconds: 5
            timeoutSeconds: 5
          # A sealed OpenBao (exit 2) is alive; only an unreachable listener (exit 1) restarts it.
          startupProbe:
            exec:
              command: [sh, -c, {{ $localStatus | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [sh, -c, {{ $localStatus | quote }}]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.openbao.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /bao/data}
            - {name: config, mountPath: /bao/config, readOnly: true}
            - {name: tls, mountPath: /bao/tls, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: "{{ include "factory.name" . }}-openbao"}
        - name: tls
          secret: {secretName: {{ include "factory.openbaoTLSSecret" . | quote }}, defaultMode: 288}
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "factory.claim" (dict "root" . "size" .Values.openbaoSize) | nindent 8 }}
