{{- /*
Generated Secrets are read back with lookup so an upgrade keeps them. Renderers without cluster
access (helm template, Argo CD) get an empty lookup and would regenerate every value on each
render. Set existingSecrets.credentials / existingSecrets.openbaoTLS for those, and the chart
creates no Secret here. helm.sh/resource-policy: keep protects them from helm uninstall only.
*/ -}}
{{- if not .Values.existingSecrets.credentials }}
{{- $name := printf "%s-credentials" (include "factory.name" .) -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and .Release.IsUpgrade (not $previous) -}}
{{- fail "The retained Factory credentials are missing. Refusing to generate replacement identities during upgrade." -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "auth-secret" "admin-password" "database-password" "zero-password" "webhook-secret" }}
  {{ $key }}: {{ if $previous }}{{ required (printf "Retained credential %s is missing" $key) (index $previous.data $key) | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{- end }}
{{- end }}
{{- if not .Values.existingSecrets.openbaoTLS }}
{{- $tlsName := printf "%s-openbao-tls" (include "factory.name" .) -}}
{{- $tls := lookup "v1" "Secret" .Release.Namespace $tlsName -}}
{{- if and .Release.IsUpgrade (not $tls) -}}
{{- fail "The retained OpenBao TLS identity is missing. Refusing certificate replacement during upgrade." -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $tls }}
  ca.crt: {{ required "Retained OpenBao CA is missing" (index $tls.data "ca.crt") | quote }}
  tls.crt: {{ required "Retained OpenBao certificate is missing" (index $tls.data "tls.crt") | quote }}
  tls.key: {{ required "Retained OpenBao private key is missing" (index $tls.data "tls.key") | quote }}
  {{- else }}
  {{- $ca := genCA (printf "%s-openbao" .Release.Name) 3650 -}}
  {{- $service := printf "%s-openbao" (include "factory.name" .) -}}
  {{- $cert := genSignedCert $service (list "127.0.0.1") (list $service (printf "%s.%s.svc" $service .Release.Namespace) "localhost") 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  {{- end }}
{{- end }}
