apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "factory.name" . }}-state
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- include "factory.claim" (dict "root" . "size" .Values.stateSize) | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: factory
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: factory
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        factory.dev/upgrade-revision: {{ .Release.Revision | quote }}
        {{- $existing := include "factory.existingSecretChecksum" (dict "root" . "names" (list .Values.existingSecrets.credentials .Values.existingSecrets.objects .Values.existingSecrets.openbaoTLS .Values.substrate.workspaceConfigurationSecret)) }}
        {{- if $existing }}
        checksum/existing-secrets: {{ $existing }}
        {{- end }}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      serviceAccountName: {{ include "factory.name" . }}
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      # No fsGroup: kubelet would add group read and write to every retained state file, and
      # Factory refuses an OpenBao token file that is group-accessible. This container chowns the
      # fresh claim once instead. Existing correctly owned Source and bootstrap
      # files remain unchanged; this is not an old-runtime adoption path.
      initContainers:
        - name: own-state
          image: {{ include "factory.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              marker=/var/lib/factory/.owner-uid-1000
              chmod 0700 /var/lib/factory
              test -e "$marker" && exit 0
              chown -R 1000:1000 /var/lib/factory
              : > "$marker"
              chown 1000:1000 "$marker"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          volumeMounts:
            - {name: state, mountPath: /var/lib/factory}
        {{- if include "factory.managedIngressTLS" . }}
        # Renew an expired leaf before a cold installation starts, not just on the daily schedule.
        - name: ensure-ingress-tls
          image: {{ include "factory.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [bun, scripts/kubernetes/ingress-tls.ts]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            {{- include "factory.containerSecurity" . | nindent 12 }}
          env:
            - name: FACTORY_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: FACTORY_HELM_RELEASE, value: {{ .Release.Name | quote }}}
            - {name: FACTORY_INGRESS_TLS_SECRET, value: "{{ include "factory.name" . }}-ingress-tls"}
            - {name: FACTORY_INGRESS_TLS_HOSTS, value: {{ include "factory.ingressHosts" . | quote }}}
            - {name: FACTORY_INGRESS_TLS_STATE_DIRECTORY, value: /var/lib/factory/ingress-tls}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: "1", memory: 128Mi}
          volumeMounts:
            - {name: ingress-ca, mountPath: /run/factory/ingress-ca, readOnly: true}
            - {name: temporary, mountPath: /tmp}
            - {name: state, mountPath: /var/lib/factory}
        {{- end }}
      containers:
        - name: factory
          image: {{ include "factory.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [flock, --nonblock, --no-fork, /var/lib/factory/bootstrap.lock, bun, scripts/kubernetes/start.ts]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            {{- include "factory.containerSecurity" . | nindent 12 }}
          envFrom:
            - configMapRef: {name: "{{ include "factory.name" . }}-config"}
          env:
            - name: FACTORY_SUBSTRATE_WORKSPACES_CONFIGURATION
              value: /run/factory/substrate-configuration/configuration.json
            - name: FACTORY_OBJECT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ include "factory.objectsSecret" . | quote }}, key: access-key-id}
            - name: FACTORY_OBJECT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "factory.objectsSecret" . | quote }}, key: secret-access-key}
            - name: FACTORY_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: FACTORY_SERVICE_ACCOUNT
              valueFrom:
                fieldRef: {fieldPath: spec.serviceAccountName}
            - name: FACTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "factory.credentialsSecret" . | quote }}, key: database-password}
            - name: DATABASE_URL
              value: "postgresql://factory:$(FACTORY_DATABASE_PASSWORD)@{{ include "factory.name" . }}-postgres.{{ .Release.Namespace }}.svc:5432/factory"
            - name: FACTORY_AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: {{ include "factory.credentialsSecret" . | quote }}, key: auth-secret}
            - name: FACTORY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "factory.credentialsSecret" . | quote }}, key: admin-password}
            - name: FACTORY_WIKI_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: {{ include "factory.credentialsSecret" . | quote }}, key: webhook-secret}
          readinessProbe:
            httpGet:
              path: /health/ready?installation=complete
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health/ready?installation=complete
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 240
          # Runs only after the startup probe above, so a long first bootstrap is not restarted.
          # /health/ready without `installation` answers 200 whenever the server is serving.
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/factory}
            - {name: temporary, mountPath: /tmp}
            - {name: openbao-tls, mountPath: /run/factory/openbao, readOnly: true}
            - {name: substrate-configuration, mountPath: /run/factory/substrate-configuration, readOnly: true}
            - {name: substrate-control, mountPath: /run/factory/substrate-control, readOnly: true}
            - {name: substrate-provisioner, mountPath: /run/factory/substrate-provisioner, readOnly: true}
            {{- if .Values.registryCASecret }}
            - {name: registry-ca, mountPath: /run/factory/registry, readOnly: true}
            {{- end }}
      volumes:
        - name: substrate-configuration
          {{- include "factory.substrateConfigurationVolume" . | nindent 10 }}
        - name: substrate-provisioner
          secret:
            secretName: {{ required "substrate.provisionerTokenSecret is required for native Workspace provisioning" .Values.substrate.provisionerTokenSecret | quote }}
            items: [{key: token, path: token}]
        - name: substrate-control
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 600
                  path: token
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.pem
        - name: state
          persistentVolumeClaim: {claimName: "{{ include "factory.name" . }}-state"}
        - name: temporary
          emptyDir: {sizeLimit: 1Gi}
        - name: openbao-tls
          secret:
            secretName: {{ include "factory.openbaoTLSSecret" . }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- if include "factory.managedIngressTLS" . }}
        - name: ingress-ca
          secret:
            secretName: {{ include "factory.name" . }}-ingress-ca
            items: [{key: ca.crt, path: ca.crt}, {key: ca.key, path: ca.key}]
        {{- end }}
        {{- if .Values.registryCASecret }}
        - name: registry-ca
          secret:
            secretName: {{ .Values.registryCASecret }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
