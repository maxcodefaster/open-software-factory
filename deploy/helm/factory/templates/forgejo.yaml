{{- $gitHosts := list "github.com" "gitlab.com" "codeberg.org" -}}
{{- range .Values.gitAllowedOrigins -}}
{{- if not (regexMatch "^https://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$" .) -}}
{{- fail "gitAllowedOrigins must contain exact public HTTPS origins without paths, ports or credentials." -}}
{{- end -}}
{{- $gitHosts = append $gitHosts (trimPrefix "https://" .) -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "factory.name" . }}-forgejo
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "factory.name" . }}-forgejo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: forgejo
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000}
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17.0.0-rootless@sha256:6554520f7574602100b7d6620c6ac5b18cec30325f823777497eac36234f5cf8
          env:
            - {name: FORGEJO__database__DB_TYPE, value: sqlite3}
            - {name: FORGEJO__database__PATH, value: /var/lib/gitea/data/forgejo.db}
            - {name: FORGEJO__security__INSTALL_LOCK, value: "true"}
            - {name: FORGEJO__service__DISABLE_REGISTRATION, value: "true"}
            - {name: FORGEJO__oauth2_client__ACCOUNT_LINKING, value: disabled}
            - {name: FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION, value: "false"}
            - {name: FORGEJO__oauth2__DEFAULT_APPLICATIONS, value: "git-credential-oauth,git-credential-manager"}
            - {name: FORGEJO__server__DISABLE_SSH, value: "true"}
            - {name: FORGEJO__server__HTTP_PORT, value: "3000"}
            - {name: FORGEJO__server__ROOT_URL, value: "{{ include "factory.forgeURL" . }}/"}
            - {name: FORGEJO__webhook__ALLOWED_HOST_LIST, value: "{{ include "factory.name" . }}-internal.{{ .Release.Namespace }}.svc"}
            - {name: FORGEJO__migrations__ALLOWED_DOMAINS, value: {{ join "," (uniq $gitHosts) | quote }}}
            - {name: FORGEJO__migrations__ALLOW_LOCALNETWORKS, value: "false"}
            - {name: FORGEJO__migrations__ALLOW_UNENCRYPTED, value: "false"}
            # Forgejo 17 uses wildcard matches here, not CIDRs. Explicitly allowed
            # hostnames must not resolve to private, loopback or link-local IPs.
            - {name: FORGEJO__migrations__BLOCKED_DOMAINS, value: "localhost,*.localhost,0.*,10.*,127.*,169.254.*,172.1[6-9].*,172.2[0-9].*,172.3[01].*,192.168.*,100.6[4-9].*,100.[7-9][0-9].*,100.1[01][0-9].*,100.12[0-7].*,::,::1,fc*:*,fd*:*,fe[89ab]*:*"}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 3000}
            periodSeconds: 2
          resources:
            {{- toYaml .Values.forgejo.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "factory.claim" (dict "root" . "size" .Values.forgejoSize) | nindent 8 }}
    - metadata:
        name: config
      spec:
        {{- include "factory.claim" (dict "root" . "size" "64Mi") | nindent 8 }}
