{{- /*
Derived from the kubectl calls in packages/runtime-kubernetes, scripts/kubernetes/start.ts and
scripts/factory/storage-readiness.ts. Factory creates a Namespace per Factorybox worker, Source and
editor, with names that are unknown until runtime, and its Namespace-scoped objects cannot be
granted by a Role. It cannot create RoleBindings (no RBAC administration is granted), so a
ClusterRole bound cluster-wide is the only available shape. That binding also covers this release's
own Namespace: the Factory ServiceAccount can read its Secrets and exec into its Pods. Consequently
no Role for Factory itself is rendered; it would add nothing. (backup.yaml renders a separate Role
for the backup ServiceAccount.) Treat the ServiceAccount as trusted infrastructure and restrict who
can run the Factory image. There is no namespace-scoped alternative: it would need RoleBindings,
which needs the RBAC administration this role deliberately lacks.
resourceNames cannot narrow any rule below because the targeted objects are created with generated
names (worker-<uuid>, assignment-<uuid>, store-<uuid>) and create cannot be limited by name.
No watch, update (except namespaces/finalize), wildcard, escalate, bind or impersonate verbs.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
rules:
  # One Namespace per worker/Source/editor, deleted with a UID precondition. The finalize
  # subresource clears a Namespace left terminating after its owned resources are gone.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [namespaces/finalize]
    verbs: [update]
  # Worker, Source, editor and retained-stop Pods. patch is server-side apply, list is the
  # node-wide Pod scan for worker admission and the storage check's provisioner-helper search.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, patch, delete]
  # Needs get and create: kubectl's WebSocket exec and port-forward start with an upgrade GET.
  # Used for worker native operations, the Forgejo bootstrap exec and Source/editor forwards.
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Runtime claims. list is the storage check's emptiness listing of its own Namespace.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, patch, delete]
  # Cluster-wide secrets access cannot be narrowed (see above). It carries the per-Sandbox
  # assignment, the registry CA and the worker's private tokens. list is the same emptiness check.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, patch, delete]
  # The storage check sets the reclaim policy of its own probe volume to Delete before cleanup.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, patch]
  # Worker admission reads the configured node; retained Stop reads a recorded storage node.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get]
  # The storage check lists these in its disposable Namespace to prove it is empty before delete.
  - apiGroups: [""]
    resources: [services, serviceaccounts, configmaps, replicationcontrollers]
    verbs: [list]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [list]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [list]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "factory.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}
