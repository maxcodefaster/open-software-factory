{{- /*
Derived from the kubectl calls in packages/runtime-kubernetes, scripts/kubernetes/start.ts and
scripts/factory/storage-readiness.ts. Factory creates developer-editor and exactly owned
storage-check Namespaces, with names that are unknown until runtime, and its Namespace-scoped objects cannot be
granted by a Role. It cannot create RoleBindings (no RBAC administration is granted), so a
ClusterRole bound cluster-wide is the only available shape. That binding also covers this release's
own Namespace: the Factory ServiceAccount can read its Secrets and exec into its Pods. Consequently
no Role for Factory itself is rendered; it would add nothing. (backup.yaml renders a separate Role
for the backup ServiceAccount.) Treat the ServiceAccount as trusted infrastructure and restrict who
can run the Factory image. There is no namespace-scoped alternative: it would need RoleBindings,
which needs the RBAC administration this role deliberately lacks.
resourceNames cannot narrow create because the targeted editor and probe objects
have generated names. Native execution uses the Substrate API, not Kubernetes worker Pods.
No watch, update (except namespaces/finalize), wildcard, escalate, bind or impersonate verbs.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
rules:
  # Editor and storage-check Namespaces, deleted with a UID precondition. The finalize
  # subresource clears a Namespace left terminating after its owned resources are gone.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [namespaces/finalize]
    verbs: [update]
  # Editor and storage-check Pods. list also supplies native joined-node
  # capacity admission and the storage check's provisioner-helper search.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, patch, delete]
  # Needs get and create: kubectl's WebSocket exec and port-forward start with an upgrade GET.
  # Used for Forgejo bootstrap and developer-editor forwards, never Actor lifecycle.
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Editor and storage-check claims. list checks exact probe namespace emptiness.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, patch, delete]
  # Cluster-wide secrets access cannot be narrowed (see above). It carries the per-Sandbox
  # editor connection and installation bootstrap projections. list is the same emptiness check.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, patch, delete]
  # The storage check sets the reclaim policy of its own probe volume to Delete before cleanup.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, patch]
  # Native capacity observes joined nodes and their current admission facts.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  # Native capacity observes the admitted profile and creates distinct pools for
  # joined suitable nodes. It cannot patch/delete the original retained pools.
  - apiGroups: ["ate.dev"]
    resources: [workerpools]
    verbs: [get, list, create]
  - apiGroups: ["ate.dev"]
    resources: [sandboxconfigs]
    verbs: [get]
  # The storage check lists these in its disposable Namespace to prove it is empty before delete.
  - apiGroups: [""]
    resources: [services, serviceaccounts, configmaps, replicationcontrollers]
    verbs: [list]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [list]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [list]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "factory.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "factory.name" . }}
