{{- if .Values.backup.enabled }}
{{- /*
One runner holds an inherited filesystem lock across every backup step, including manual Jobs.
Init containers only set volume ownership and stage static tools from existing images.
A failed step leaves a marker and does not stop the next one; finalization fails an incomplete Job.
PostgreSQL and Forgejo commands run in their existing Pods; only the runner writes backup data.
*/ -}}
{{- $name := include "factory.name" . }}
{{- $openbaoImage := "docker.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf" }}
{{- $rcloneImage := "docker.io/rclone/rclone:1.74.1@sha256:eb8788b795f0009324e9572b0e2acb9b56885327c2746b07d67a9d3b893a6602" }}
{{- $retention := int .Values.backup.retention }}
{{- if or (ne (toString .Values.backup.retention) (printf "%d" $retention)) (lt $retention 1) }}
{{- fail "backup.retention must be a positive whole number of backup sets to keep" }}
{{- end }}
{{- $execTimeout := int .Values.backup.execTimeoutSeconds }}
{{- if or (ne (toString .Values.backup.execTimeoutSeconds) (printf "%d" $execTimeout)) (lt $execTimeout 1) }}
{{- fail "backup.execTimeoutSeconds must be a positive whole number of seconds" }}
{{- end }}
{{- if not .Values.backup.schedule }}
{{- fail "backup.schedule must be a cron expression" }}
{{- end }}
{{- if ne (empty .Values.backup.remote.existingSecret) (empty .Values.backup.remote.path) }}
{{- fail "backup.remote.existingSecret and backup.remote.path must be set together" }}
{{- end }}
{{- if and .Values.backup.remote.path (not (regexMatch "^[A-Za-z0-9_-]+:.+$" .Values.backup.remote.path)) }}
{{- fail "backup.remote.path must name a remote from the rclone.conf in the Secret, for example backup:bucket/factory" }}
{{- end }}
{{- $objects := include "factory.objectsSecret" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "factory.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/backup/*" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
---
{{- /*
The claim belongs to a one-container StatefulSet instead of a stand-alone PersistentVolumeClaim.
Storage classes with WaitForFirstConsumer binding (the AKS default among them) leave a claim
Pending until a Pod uses it, and `helm --wait` would then never finish. The holder Pod only
sleeps; it binds the claim and keeps it on the node where Factory and the backup Job run.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-backup-store
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-backup-store
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: backup-store
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: backup-store
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
                  app.kubernetes.io/component: factory
      containers:
        - name: hold
          image: {{ $rcloneImage }}
          command: [sleep, infinity]
          securityContext:
            runAsNonRoot: true
            {{- include "factory.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: store, mountPath: /backup, readOnly: true}
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        {{- include "factory.claim" (dict "root" . "size" .Values.backup.size) | nindent 8 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "factory.labels" . | nindent 4 }}
---
{{- /*
The database and Forgejo dumps run inside the Pods that own their tools and data.
The backup ServiceAccount may exec into those two exact Pods and nothing else.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [{{ $name }}-postgres-0, {{ $name }}-forgejo-0]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [{{ $name }}-postgres-0, {{ $name }}-forgejo-0]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
            app.kubernetes.io/component: backup
        spec:
          nodeSelector: {kubernetes.io/os: linux}
          restartPolicy: Never
          serviceAccountName: {{ $name }}-backup
          # Only the runner uses this token; the Role above is its entire authority.
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          # The state claim is ReadWriteOnce, so the Pod runs where Factory runs.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: {{ .Release.Name | quote }}
                      app.kubernetes.io/component: factory
          initContainers:
            - name: own-backup
              image: {{ $rcloneImage }}
              command: [chown, "1000:1000", /backup, /tools]
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
                seccompProfile: {type: RuntimeDefault}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 250m, memory: 64Mi}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tools, mountPath: /tools}
            - name: stage-kubectl
              image: {{ include "factory.image" . }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: [cp, /usr/local/bin/kubectl, /usr/local/bin/factory-sqlite, /tools/]
              securityContext:
                runAsNonRoot: true
                {{- include "factory.containerSecurity" . | nindent 16 }}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 250m, memory: 64Mi}
              volumeMounts:
                - {name: tools, mountPath: /tools}
            - name: stage-bao
              image: {{ $openbaoImage }}
              command: [cp, /usr/bin/bao, /tools/bao]
              securityContext:
                runAsNonRoot: true
                {{- include "factory.containerSecurity" . | nindent 16 }}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 250m, memory: 64Mi}
              volumeMounts:
                - {name: tools, mountPath: /tools}
          containers:
            - name: backup
              image: {{ $rcloneImage }}
              command: [sh, /scripts/run.sh]
              securityContext:
                runAsNonRoot: true
                {{- include "factory.containerSecurity" . | nindent 16 }}
              env:
                - {name: HOME, value: /tmp}
                - {name: PATH, value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"}
                - name: BACKUP_NAMESPACE
                  valueFrom:
                    fieldRef: {fieldPath: metadata.namespace}
                - name: BACKUP_POD_UID
                  valueFrom:
                    fieldRef: {fieldPath: metadata.uid}
                - {name: POSTGRES_POD, value: "{{ $name }}-postgres-0"}
                - {name: FORGEJO_POD, value: "{{ $name }}-forgejo-0"}
                - {name: RCLONE_CONFIG_OBJECTS_TYPE, value: s3}
                - {name: RCLONE_CONFIG_OBJECTS_PROVIDER, value: Other}
                - {name: RCLONE_CONFIG_OBJECTS_ENDPOINT, value: "http://{{ $name }}-objects.{{ .Release.Namespace }}.svc:3900"}
                - {name: RCLONE_CONFIG_OBJECTS_REGION, value: garage}
                - {name: RCLONE_CONFIG_OBJECTS_FORCE_PATH_STYLE, value: "true"}
                - name: RCLONE_CONFIG_OBJECTS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: {{ $objects | quote }}, key: access-key-id}
                - name: RCLONE_CONFIG_OBJECTS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: {{ $objects | quote }}, key: secret-access-key}
                - {name: BAO_ADDR, value: "https://{{ $name }}-openbao.{{ .Release.Namespace }}.svc:8200"}
                - {name: BAO_CACERT, value: /bao/tls/ca.crt}
                - {name: BACKUP_RETENTION, value: {{ $retention | quote }}}
                - {name: BACKUP_EXEC_TIMEOUT_SECONDS, value: {{ $execTimeout | quote }}}
                {{- if .Values.backup.remote.path }}
                - {name: BACKUP_REMOTE, value: {{ .Values.backup.remote.path | quote }}}
                - {name: RCLONE_CONFIG, value: /rclone/rclone.conf}
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: temporary, mountPath: /tmp}
                - {name: tools, mountPath: /tools, readOnly: true}
                - {name: state, mountPath: /state, readOnly: true}
                - {name: openbao-tls, mountPath: /bao/tls, readOnly: true}
                {{- if .Values.backup.openbao.tokenSecret }}
                - {name: openbao-token, mountPath: /openbao-token, readOnly: true}
                {{- else }}
                - {name: openbao-login, mountPath: /openbao-login, readOnly: true}
                {{- end }}
                {{- if .Values.backup.remote.existingSecret }}
                - {name: remote, mountPath: /rclone, readOnly: true}
                {{- end }}
          volumes:
            - name: backup
              persistentVolumeClaim: {claimName: store-{{ $name }}-backup-store-0}
            - name: state
              persistentVolumeClaim: {claimName: {{ $name }}-state, readOnly: true}
            - name: scripts
              configMap: {name: {{ $name }}-backup}
            - name: temporary
              emptyDir: {sizeLimit: 1Gi}
            - name: tools
              emptyDir: {sizeLimit: 256Mi}
            - name: openbao-tls
              secret:
                secretName: {{ include "factory.openbaoTLSSecret" . }}
                items: [{key: ca.crt, path: ca.crt}]
            {{- if .Values.backup.openbao.tokenSecret }}
            - name: openbao-token
              secret:
                secretName: {{ .Values.backup.openbao.tokenSecret }}
                items: [{key: token, path: token}]
            {{- else }}
            {{- /* Factory creates this Secret when it bootstraps OpenBao. Optional, so a first run
            before that, or an installation not yet adopted, writes openbao.skipped and warns. */}}
            - name: openbao-login
              secret:
                secretName: {{ $name }}-backup-openbao
                optional: true
                items: [{key: role-id, path: role-id}, {key: secret-id, path: secret-id}]
            {{- end }}
            {{- if .Values.backup.remote.existingSecret }}
            - name: remote
              secret:
                secretName: {{ .Values.backup.remote.existingSecret }}
                items: [{key: rclone.conf, path: rclone.conf}]
            {{- end }}
{{- end }}
