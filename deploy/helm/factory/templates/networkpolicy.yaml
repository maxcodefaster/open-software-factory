{{- if .Values.networkPolicy.enabled }}
{{- /*
Ingress is denied for every Pod of this release, then each flow Factory uses is allowed:
  Factory   <- Zero, Forgejo (callbacks, OIDC discovery), runtime namespaces (/internal/*), ingress controller
  Forgejo   <- Factory, runtime namespaces (git clone/push), ingress controller
  Zero      <- Factory, ingress controller (/zero)
  PostgreSQL<- Factory, Zero, the pre-upgrade maintenance Job, the backup Job
  OpenBao   <- Factory, the backup Job
  Garage    <- Factory, the backup Job
`kubectl port-forward` (factory:connect, Source/editor forwards) enters through the Pod's own
loopback and is not subject to these policies. Probes come from the kubelet on the node.
Runtime namespaces are every Namespace labelled app.kubernetes.io/managed-by=open-software-factory,
which Factory sets on each Namespace it creates. They cannot reach PostgreSQL, OpenBao or Garage.
*/ -}}
{{- $name := include "factory.name" . }}
{{- $instance := .Release.Name }}
{{- $runtime := dict "namespaceSelector" (dict "matchLabels" (dict "app.kubernetes.io/managed-by" "open-software-factory")) }}
{{- $controller := dict "namespaceSelector" (default (dict) .Values.networkPolicy.ingressControllerNamespaceSelector) }}
{{- $peers := dict }}
{{- range $component := list "factory" "forgejo" "zero" "postgres" "openbao" "objects" "maintenance" "backup" }}
{{- $_ := set $peers $component (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/instance" $instance "app.kubernetes.io/component" $component))) }}
{{- end }}
{{- /*
Pods created by a Job can be refused for a few seconds after they start, until the CNI programs
their labels. The backup steps retry their connections for that reason.
*/}}
{{- $backup := ternary (list (get $peers "backup")) (list) .Values.backup.enabled }}
{{- $rules := list
  (dict "component" "factory" "port" 3000 "from" (list (get $peers "zero") (get $peers "forgejo") $runtime) "controller" true)
  (dict "component" "forgejo" "port" 3000 "from" (list (get $peers "factory") $runtime) "controller" true)
  (dict "component" "zero" "port" 4848 "from" (list (get $peers "factory")) "controller" true)
  (dict "component" "postgres" "port" 5432 "from" (concat (list (get $peers "factory") (get $peers "zero") (get $peers "maintenance")) $backup))
  (dict "component" "openbao" "port" 8200 "from" (concat (list (get $peers "factory") (get $peers "openbao")) $backup))
  (dict "component" "objects" "port" 3900 "from" (concat (list (get $peers "factory")) $backup)) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-default-deny-ingress
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance | quote }}
  policyTypes: [Ingress]
{{- range $rule := $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-allow-{{ $rule.component }}
  labels:
    {{- include "factory.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance | quote }}
      app.kubernetes.io/component: {{ $rule.component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml $rule.from | nindent 8 }}
        {{- if and $rule.controller $.Values.ingress.enabled }}
        {{- toYaml (list $controller) | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $rule.port }}}
{{- end }}
{{- /*
Backends have no reason to start connections beyond DNS. OpenBao also dials its own Service
address in the readiness probe, so it may reach its own Pod.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-restrict-backend-egress
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance | quote }}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [postgres, openbao, objects]}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance | quote }}
              app.kubernetes.io/component: openbao
      ports:
        - {protocol: TCP, port: 8200}
{{- end }}
