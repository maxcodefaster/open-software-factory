# Kept in this repository during development. Build/load an application image
# containing the exact runtime-artifacts.json before local acceptance.
image: ""
imagePullPolicy: IfNotPresent
publicURL: ""
forgejoPublicURL: ""
development: false
# Only for development port-forwarding. Use the same loopback hostname as publicURL.
# Ingress installations use publicURL/zero automatically.
developmentZeroURL: ""
adminEmail: admin@factory.local

# Exact private image and node tuple admitted with Factorybox native acceptance.
factorybox:
  image: ""
  executableSHA256: ""
  architecture: ""
  nodeName: ""
  kernel: ""
  # Scheduling reserve, not a fixed CPU allocation. Kubernetes shares spare CPU
  # up to the qualified 3-core ceiling. Retained profiles are not resized.
  cpuRequestMilli: 100
  # Choose before the first execution. Existing worker profiles are immutable.
  storeGiB: 8
  # Includes the bounded image, 16 GiB admission floor and metadata headroom.
  claimGiB: 32
executionReserveTarget: 2

# Empty uses the cluster's default dynamically provisioned RWO StorageClass.
storageClass: ""
stateSize: 1Gi
databaseSize: 8Gi
forgejoSize: 8Gi
openbaoSize: 1Gi
zeroSize: 2Gi
# Explicit rather than scaling Node processes to every CPU on the Kubernetes node.
zeroSyncWorkers: 1

# One chart-managed private store for attachments, QA recordings and annotation stills.
objectStorage:
  size: 16Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

postgres:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

forgejo:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

openbao:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

zero:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

attachments:
  fileBytes: 10485760
  messageBytes: 20971520

# Optional extra CA for private runtime image registries. The Secret must have
# a ca.crt key. Without it, Factory uses the image's normal system trust bundle.
registryCASecret: ""
modelAllowedOrigins: []
# Extra public HTTPS Git hosts shared by Project import and native push mirrors.
# GitHub, GitLab.com and Codeberg are already allowed.
gitAllowedOrigins: []

ingress:
  enabled: false
  className: ""
  tlsSecret: ""
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# The pre-upgrade fence runs while the existing Factory Pod is still serving.
maintenance:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
