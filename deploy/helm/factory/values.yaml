# Required. Build/load an application image containing the exact runtime-artifacts.json.
# Use an @sha256 digest reference for anything other than local acceptance.
image: ""
imagePullPolicy: IfNotPresent
publicURL: ""
forgejoPublicURL: ""
development: false
# Only for development port-forwarding. Use the same loopback hostname as publicURL.
# Ingress installations use publicURL/zero automatically.
developmentZeroURL: ""
adminEmail: admin@factory.local

# Exact private image and node tuple admitted with Factorybox native acceptance.
factorybox:
  image: ""
  executableSHA256: ""
  architecture: ""
  nodeName: ""
  kernel: ""
  # Scheduling reserve, not a fixed CPU allocation. Fresh workers select their
  # aggregate ceiling from the admitted node; retained profiles are not resized.
  cpuRequestMilli: 100
  # Subtract other Pods' scheduling reservations and leave this additional
  # memory for helpers and future Source/IDE startup before admitting a worker.
  memoryHeadroomMiB: 2048
  # A fresh worker selects within these bounds from actual backing capacity.
  # The admitted size and existing worker profiles remain immutable.
  storeGiB: 64
  minimumStoreGiB: 8
  # Includes the bounded image, 16 GiB admission floor and metadata headroom.
  claimGiB: 128
executionReserveTarget: 2

# Empty uses the cluster's default dynamically provisioned RWO StorageClass.
storageClass: ""
stateSize: 1Gi
databaseSize: 8Gi
forgejoSize: 8Gi
openbaoSize: 1Gi
zeroSize: 2Gi
# Explicit rather than scaling Node processes to every CPU on the Kubernetes node.
zeroSyncWorkers: 1

# One chart-managed private store for attachments, QA recordings and annotation stills.
objectStorage:
  size: 16Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

postgres:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

forgejo:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

openbao:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

zero:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

attachments:
  fileBytes: 10485760
  messageBytes: 20971520

# Optional extra CA for private runtime image registries. The Secret must have
# a ca.crt key. Without it, Factory uses the image's normal system trust bundle.
registryCASecret: ""
modelAllowedOrigins: []
# Extra public HTTPS Git hosts shared by Project import and native push mirrors.
# GitHub, GitLab.com and Codeberg are already allowed.
gitAllowedOrigins: []

# Chart-generated credentials are created once from `lookup` and retained. `helm template`,
# Argo CD and other renderers without cluster access cannot see that Secret and would
# generate new values on every render. Point these at Secrets you manage (External Secrets,
# SealedSecrets, SOPS) to avoid that. Each value is a Secret name in the release namespace.
existingSecrets:
  # Keys: auth-secret, admin-password, database-password, zero-password, webhook-secret
  credentials: ""
  # Keys: access-key-id (GK + 32 hex), secret-access-key, rpc-secret
  objects: ""
  # Keys: ca.crt, tls.crt, tls.key. The certificate needs the OpenBao Service DNS names and 127.0.0.1.
  openbaoTLS: ""
  # Bump to roll Factory, Zero, Garage and OpenBao after changing an existing Secret when the
  # renderer cannot `lookup` it (Argo CD). Helm and Flux roll them from the Secret contents.
  revision: ""

# Default-deny ingress for this release's Pods plus the flows Factory uses. Requires a CNI
# that enforces NetworkPolicy; without one the objects are accepted and ignored.
networkPolicy:
  enabled: true
  # Namespaces whose Pods may reach Factory, Forgejo and Zero on their HTTP ports when
  # ingress.enabled is true. Empty allows every namespace; set the controller's namespace
  # labels, for example {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}.
  ingressControllerNamespaceSelector: {}

ingress:
  enabled: false
  className: ""
  tlsSecret: ""
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# The pre-upgrade fence runs while the existing Factory Pod is still serving.
maintenance:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
