# Required. Build/load an application image containing the exact runtime-artifacts.json.
# Use an @sha256 digest reference for anything other than local acceptance.
image: ""
imagePullPolicy: IfNotPresent
publicURL: ""
forgejoPublicURL: ""
development: false
# Only for development port-forwarding. Use the same loopback hostname as publicURL.
# Ingress installations use publicURL/zero automatically.
developmentZeroURL: ""
adminEmail: admin@factory.local
# Optional override of the prepared Starter images in the release's complete artifact bundle.
# Set platform (linux/arm64 or linux/amd64), development and postgres (@sha256 references).
# Installation selects existing images; it never builds or invents them.
starterImages: {}

# Empty uses the cluster's default dynamically provisioned RWO StorageClass.
storageClass: ""
# Also holds independently served Source trees while native compute is paused.
stateSize: 8Gi
databaseSize: 8Gi
forgejoSize: 8Gi
openbaoSize: 1Gi
zeroSize: 2Gi
# Explicit rather than scaling Node processes to every CPU on the Kubernetes node.
zeroSyncWorkers: 1

# One chart-managed private store for attachments, QA recordings and annotation stills.
objectStorage:
  size: 16Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

postgres:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

forgejo:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

openbao:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

zero:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

attachments:
  fileBytes: 10485760
  messageBytes: 20971520

# Optional extra CA for private runtime image registries. The Secret must have
# a ca.crt key. Without it, Factory uses the image's normal system trust bundle.
registryCASecret: ""
modelAllowedOrigins: []
# Extra public HTTPS Git hosts shared by Project import and native push mirrors.
# GitHub, GitLab.com and Codeberg are already allowed.
gitAllowedOrigins: []

# Chart-generated credentials are created once from `lookup` and retained. `helm template`,
# Argo CD and other renderers without cluster access cannot see that Secret and would
# generate new values on every render. Point these at Secrets you manage (External Secrets,
# SealedSecrets, SOPS) to avoid that. Each value is a Secret name in the release namespace.
existingSecrets:
  # Keys: auth-secret, admin-password, database-password, zero-password, webhook-secret
  credentials: ""
  # Keys: access-key-id (GK + 32 hex), secret-access-key, rpc-secret
  objects: ""
  # Keys: ca.crt, tls.crt, tls.key. The certificate needs the OpenBao Service DNS names and 127.0.0.1.
  openbaoTLS: ""
  # Bump to roll Factory, Zero, Garage and OpenBao after changing an existing Secret when the
  # renderer cannot `lookup` it (Argo CD). Helm and Flux roll them from the Secret contents.
  revision: ""

# Scheduled backups into a dedicated claim, optionally copied to an operator-owned remote. See
# the chart README for what each set contains and how to restore it.
backup:
  enabled: true
  # Cron expression in the controller's time zone (normally UTC).
  schedule: "17 2 * * *"
  # Complete backup sets kept on the claim. Each holds a PostgreSQL dump, a Forgejo dump, the
  # Factory state and an OpenBao snapshot. The object-store mirror is kept once beside them.
  retention: 7
  # Size for retention x (database + Forgejo + state) plus one copy of the object store.
  size: 40Gi
  # Wall-clock limit for each kubectl exec attempt, including stream/status completion.
  # Increase for large dumps or validation. The whole Job still has a six-hour deadline.
  execTimeoutSeconds: 1800
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  openbao:
    # Override. By default the Job logs in with the least-privilege AppRole that Factory creates
    # and stores in the Secret `<release>-backup-openbao`. To use your own credential instead, set
    # a Secret with a `token` key: `read` on sys/storage/raft/snapshot, `update` on
    # auth/token/renew-self. Each run renews that token.
    tokenSecret: ""
  remote:
    # Secret with an `rclone.conf` key that defines the remote named in `path`.
    existingSecret: ""
    # For example `backup:my-bucket/factory`. Empty keeps backups on the claim only.
    path: ""

# Default-deny ingress for this release's Pods plus the flows Factory uses. Requires a CNI
# that enforces NetworkPolicy; without one the objects are accepted and ignored.
networkPolicy:
  enabled: true
  # Namespaces whose Pods may reach Factory, Forgejo and Zero on their HTTP ports when
  # ingress.enabled is true. Empty allows every namespace; set the controller's namespace
  # labels, for example {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}.
  ingressControllerNamespaceSelector: {}

ingress:
  enabled: false
  className: ""
  # Empty issues installation-owned TLS and renews leaves automatically. No host CA tooling.
  # Set an operator-owned TLS Secret to opt out; then supply factory-ca.pem with native config.
  tlsSecret: ""
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# The pre-upgrade fence runs while the existing Factory Pod is still serving.
maintenance:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
substrate:
  # Required. Installation-wide native configuration (configuration.json).
  # Managed Ingress TLS projects its public CA automatically as factory-ca.pem.
  # Other ingress/transport owners also supply factory-ca.pem in this Secret.
  workspaceConfigurationSecret: ""
  # Separately rotated, short-lived native global-owner credential (key: token).
  # Actor calls use the application's projected editor token, never this one.
  provisionerTokenSecret: ""
